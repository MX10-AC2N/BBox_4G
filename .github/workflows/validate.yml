name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # lets the job commit the updated test report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - name: Run the tests (and write the human-readable report)
        run: pytest
        env:
          BBOX_TEST_REPORT: "1"
      - name: Show the report in the run summary
        if: always()
        run: cat docs/TEST_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report in the repository
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TEST_REPORT.md docs/TEST_REPORT_french.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update the test report [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
