refresh:
  name: Refresh
  description: Re-reads the state of the router.

block_device:
  name: Block a device
  description: Blocks a device on the router network.
  fields:
    mac:
      name: MAC address
      description: MAC address of the device to block.
      required: true
      example: "aa:bb:cc:dd:ee:ff"
      selector:
        text:

unblock_device:
  name: Unblock a device
  description: Releases a blocked device.
  fields:
    mac:
      name: MAC address
      description: MAC address of the device to release.
      required: true
      example: "aa:bb:cc:dd:ee:ff"
      selector:
        text:

set_wifi:
  name: Toggle Wi-Fi
  description: Turns the router Wi-Fi on or off.
  fields:
    band:
      name: Band
      description: “all”, “24” or “5”.
      required: true
      example: "all"
      selector:
        select:
          options:
            - "all"
            - "24"
            - "5"
    enabled:
      name: Enabled
      description: true to turn on, false to turn off.
      required: true
      selector:
        boolean:

wake_device:
  name: Wake a device
  description: Sends a magic packet (Wake-on-LAN) to power the device on.
  fields:
    mac:
      name: MAC address
      description: MAC address of the device to wake.
      required: true
      example: "aa:bb:cc:dd:ee:ff"
      selector:
        text:

set_internet_access:
  name: Cut Internet access of a device
  description: Cuts (or restores) the Internet output of a device.
  fields:
    mac:
      name: MAC address
      required: true
      selector:
        text:
    allowed:
      name: Access allowed
      required: true
      selector:
        boolean:

set_wifi_access:
  name: Allow or deny Wi-Fi of a device
  description: Adds the device to the black list of its Wi-Fi network, or removes it.
  fields:
    mac:
      name: MAC address
      required: true
      selector:
        text:
    allowed:
      name: Access allowed
      required: true
      selector:
        boolean:

create_dashboard:
  name: Create / update dashboards
  description: >
    Creates the selected Bbox dashboards in the sidebar (storage mode).
    Choose which variants to install.
  fields:
    dashboards:
      name: Dashboards
      description: One or more variants to create.
      required: true
      example: '["auto"]'
      selector:
        select:
          multiple: true
          options:
            - label: Native (no extra cards)
              value: native
            - label: Auto-entities (dynamic)
              value: auto
            - label: Mushroom (nice UI)
              value: mushroom

grant_extra_time:
  name: Grant extra time
  description: Lifts every parental-control restriction of a profile (schedule and quota) for a while.
  fields:
    profile:
      name: Profile
      description: Name of the parental-control profile.
      required: true
      example: "Léa"
      selector:
        text:
    minutes:
      name: Minutes
      description: Duration of the override (default 60). 0 cancels a running override.
      default: 60
      selector:
        number:
          min: 0
          max: 720
          unit_of_measurement: min
